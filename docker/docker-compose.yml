version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: twitter_yoldas_db
    environment:
      POSTGRES_DB: twitter_yoldas
      POSTGRES_USER: yoldas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yoldas_secret}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoldas -d twitter_yoldas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: twitter_yoldas_pgdata
